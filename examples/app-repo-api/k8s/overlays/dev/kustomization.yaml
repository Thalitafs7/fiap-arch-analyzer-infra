apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: api-cadastro-dev

namespace: arch-analyzer-api

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: api-cadastro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: api-cadastro
    newName: YOUR_REGISTRY/api-cadastro
    newTag: dev-latest
