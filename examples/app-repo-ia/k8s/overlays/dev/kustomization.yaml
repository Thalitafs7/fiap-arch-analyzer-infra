apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ia-service-dev

namespace: arch-analyzer-ia

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: ia-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: ia-service
    newName: YOUR_REGISTRY/ia-service
    newTag: dev-latest
