apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-service
  labels:
    app: ia-service
    component: ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-service
  template:
    metadata:
      labels:
        app: ia-service
        component: ia
    spec:
      serviceAccountName: ia-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
      containers:
        - name: ia-service
          image: ia-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: infra-config
          env:
            - name: QDRANT_HOST
              value: "qdrant.arch-analyzer-ia.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: API_WEBHOOK_URL
              value: "http://api-cadastro.arch-analyzer-api.svc.cluster.local/webhook/report"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
