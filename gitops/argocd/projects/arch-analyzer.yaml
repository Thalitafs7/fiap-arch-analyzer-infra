apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arch-analyzer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Arch Analyzer project - API and IA services"
  sourceRepos:
    - "https://github.com/YOUR_ORG/arch-analyzer-api.git"
    - "https://github.com/YOUR_ORG/arch-analyzer-ia.git"
  destinations:
    - namespace: arch-analyzer-api
      server: https://kubernetes.default.svc
    - namespace: arch-analyzer-ia
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: "apps"
      kind: "*"
    - group: "networking.k8s.io"
      kind: "*"
  orphanedResources:
    warn: true
